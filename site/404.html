<style>body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:#f3f6f2;color:#14231f;max-width:640px;margin:15vh auto;padding:0 20px;line-height:1.6}a{color:#0b6e4f}
/* v2: brand hero, review components, footer */
.hero{background:linear-gradient(135deg,#0d7a58,#0a5340);color:#fff;border-radius:18px;padding:30px 30px 26px;display:grid;grid-template-columns:1fr 190px;gap:10px 26px;align-items:center;margin:0 0 6px;box-shadow:0 14px 34px rgba(11,94,68,.22)}
.hero h1{color:#fff;margin:0 0 10px}.hero .lede{color:#d9ece4;margin:0 0 16px}
.hero .mascot svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{margin:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
.chips li::before{content:"✓ ";color:#f2b632}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:24px 20px}.hero .mascot{width:120px;order:-1}}
.choice .ico{width:42px;height:42px;border-radius:10px;background:#e3f1ea;display:grid;place-items:center;font-size:1.4rem;margin-bottom:2px}
.choice{transition:transform .15s, box-shadow .15s}.choice:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,35,31,.08)}
.new{display:inline-block;background:var(--mark);color:#14231f;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.byline{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);margin:-4px 0 14px}
.byline img{width:34px;height:34px;border-radius:50%}
.verdict{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:16px 20px;margin:22px 0}
.verdict p{margin:0}.verdict .vk{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 20px;margin:18px 0 6px}
.toc p{margin:0 0 4px;font-weight:700;font-family:var(--display)}.toc ol{margin:0;columns:2;column-gap:28px}.toc li{margin:0 0 4px;break-inside:avoid}
@media (max-width:640px){.toc ol{columns:1}}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 6px}
@media (max-width:640px){.pc{grid-template-columns:1fr}}
.pc>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.pc .pro{border-top:4px solid var(--accent)}.pc .con{border-top:4px solid #c2564b}
.pc ul{list-style:none;padding:0;margin:0}.pc li{padding-left:1.5em;position:relative}
.pc .pro li::before{content:"+";position:absolute;left:0;font-weight:700;color:var(--accent)}
.pc .con li::before{content:"–";position:absolute;left:0;font-weight:700;color:#c2564b}
.pch{font-family:var(--display);font-weight:700;margin:0 0 6px}
table.facts{border-collapse:collapse;width:100%;max-width:520px;margin:8px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.facts th,table.facts td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-size:.97rem}
table.facts th{font-weight:600;color:var(--muted);width:60%}table.facts td{font-weight:700}
.note{background:#fff7e0;border-radius:8px;padding:12px 16px;color:#14231f}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 10px}
.faq summary{cursor:pointer;font-weight:700;font-family:var(--display)}.faq details p{margin:8px 0 0}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
footer nav{gap:6px 16px}footer nav a{color:var(--muted)}
</style>
